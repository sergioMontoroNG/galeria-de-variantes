# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "8ee4ad7d82418f8b4110ae69ad4d4bbe"
name = "galeria de variantes"
application_url = "https://galeria-de-variantes-mx.vercel.app"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,write_metaobjects,write_metaobject_definitions"

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[variant.metafields.app.gallery]
type = "list.file_reference"
name = "Mini galeria de variante"
description = "Ordered list of images shown when this variant is selected on the storefront"

  [variant.metafields.app.gallery.access]
  storefront = "public_read"

[variant.metafields.app.gallery_videos]
type = "json"
name = "Videos de la mini galeria"
description = "YouTube videos shown in this variant's gallery: [{youtubeId, position}], position = gallery images before the video"

  [variant.metafields.app.gallery_videos.access]
  storefront = "public_read"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

  [metaobjects.app.example.access]
  admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[auth]
redirect_urls = [ "https://galeria-de-variantes-mx.vercel.app/auth/callback" ]

[build]
automatically_update_urls_on_dev = true
